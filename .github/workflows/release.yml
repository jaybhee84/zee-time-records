name: Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Extract exact version from package.json
      - name: Get Version from package.json
        id: get_version
        shell: powershell
        run: |
          $ver = node -p "require('./package.json').version"
          echo "APP_VERSION=v$ver" >> $env:GITHUB_ENV
          echo "Version found: v$ver"

      # Run Electron Packaging Script
      # Adjust 'npm run dist' if your package.json script uses a different name (e.g., 'npm run build:win' or 'npm run electron:build')
      - name: Build Electron Executable
        run: |
          npm run build
          npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create Tag and Release with Executable Attached
      - name: Create Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            release/*.exe
            out/*.exe
            dist_electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
