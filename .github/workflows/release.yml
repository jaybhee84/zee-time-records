name: Build and Release

on:
  push:
    tags:
      - "v*" # Triggers automatically when you push a version tag (e.g. v2.0.10)
  workflow_dispatch: # Allows manual triggers directly from the GitHub Actions tab

permissions:
  contents: write # Required for publishing releases and uploading binary assets

jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Set App Version Environment Variable
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Build Electron Executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prevents electron-builder from failing on un-signed macOS builds
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run electron:build

      - name: Upload Executables to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            release/*.exe
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
