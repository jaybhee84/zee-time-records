name: Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # Safe version extraction using UTF-8 encoding
      - name: Get Version from package.json
        id: get_version
        shell: powershell
        run: |
          $ver = node -p "require('./package.json').version"
          "APP_VERSION=v$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Version found: v$ver"

      # Prevents electron-builder from auto-publishing so softprops can handle it
      - name: Build Electron Executable
        run: npm run electron:build -- --publish never

      # Attaches the built installer to the GitHub Release
      - name: Create Release & Upload Executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
