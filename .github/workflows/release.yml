name: Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # Cross-platform version extraction using bash (works on both Windows and macOS runners)
      - name: Get Version from package.json
        id: get_version
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "APP_VERSION=v$VER" >> $GITHUB_ENV
          echo "Version found: v$VER"

      # Builds .exe on Windows and .dmg / .zip on macOS automatically
      - name: Build Electron Executable
        run: npm run electron:build -- --publish never

      # Uploads .exe, .dmg, and .zip installers to the release tag
      - name: Create or Update Release & Upload Executables
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
