name: Automatic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # Pulls '2.0.1' from package.json and turns it into 'v2.0.1'
      - name: Get Version from package.json
        id: get_version
        shell: powershell
        run: |
          $ver = node -p "require('./package.json').version"
          echo "APP_VERSION=v$ver" >> $env:GITHUB_ENV
          echo "Version found: v$ver"

      # Runs your exact script: "vite build && cross-env ... electron-builder"
      - name: Build Electron Executable
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attaches the built .exe from your designated output folder ("release")
      - name: Create Release & Upload Executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
